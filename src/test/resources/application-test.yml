spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sonbadream-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: warn
    com.sonbadream_server: info

jwt:
  secret: test-secret-key-for-jwt-signing-must-be-long-enough-1234567890

cloudflare:
  r2:
    access-key: test-access-key
    secret-key: test-secret-key

admin:
  verification:
    password-hash: test-password-hash

kakao:
  client:
    id: test-client-id
  redirect:
    uri: http://localhost:8080/auth/kakao/callback

app:
  base-url: http://localhost:8080
  frontend-url: http://localhost:5173
  cookie-secure: false
  cookie-same-site: Lax
  auth-rate-limit:
    enabled: false

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare image name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          JWT_SECRET: test-jwt-secret-key-for-tests
          CLOUDFLARE_R2_ACCESS_KEY: test-access-key
          CLOUDFLARE_R2_SECRET_KEY: test-secret-key
          ADMIN_VERIFICATION_PASSWORD_HASH: $2a$10$abcdefghijklmnopqrstuu/uq8TjZlZ5lAK/N6rPQPp8S0NWqKB8S
        run: ./gradlew test

      - name: Build boot jar
        run: ./gradlew clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/sonbadream-ec2.pem
          chmod 600 ~/.ssh/sonbadream-ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          ssh -i ~/.ssh/sonbadream-ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/sonbadream/deploy/prometheus"
          scp -i ~/.ssh/sonbadream-ec2.pem deploy/docker-compose.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/sonbadream/deploy/docker-compose.yml"
          scp -i ~/.ssh/sonbadream-ec2.pem deploy/prometheus/prometheus.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/sonbadream/deploy/prometheus/prometheus.yml"

      - name: Restart app on EC2
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | ssh -i ~/.ssh/sonbadream-ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin"
          ssh -i ~/.ssh/sonbadream-ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "cd ~/sonbadream/deploy && APP_IMAGE='${{ env.IMAGE_NAME }}:latest' docker compose pull app && APP_IMAGE='${{ env.IMAGE_NAME }}:latest' docker compose up -d app && docker image prune -f"
